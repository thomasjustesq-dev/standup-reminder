# XcodeGen project for the full app family:
#   brew install xcodegen
#   xcodegen generate
#   xcodebuild -scheme StandUpReminder build                       # Mac app + widget
#   xcodebuild -scheme StandUpReminderiOS \
#     -destination 'platform=iOS Simulator,name=iPhone 17' build   # iPhone + Watch
name: StandUpReminder
options:
  bundleIdPrefix: com.thomasjust
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: BBTNHBK7VX
    CODE_SIGN_STYLE: Automatic
targets:
  StandUpReminder:
    type: application
    platform: macOS
    sources:
      - Sources/StandUpReminder
      - Sources/StandUpReminderCore
      - Sources/DebugHarness
      - Resources/Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasjust.standupreminder
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/StandUpReminder.entitlements
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks"]
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
          PROVISIONING_PROFILE_SPECIFIER: StandUpReminder Main Devid 20260810234319
    dependencies:
      - target: StandUpReminderWidget
        embed: true

  StandUpReminderWidget:
    type: app-extension
    platform: macOS
    sources:
      - Sources/StandUpReminderWidget
      - Sources/StandUpReminderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasjust.standupreminder.widget
        INFOPLIST_FILE: Sources/StandUpReminderWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/StandUpReminderWidget.entitlements
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp
          PROVISIONING_PROFILE_SPECIFIER: StandUpReminder Widget Devid 20260810234320

  StandUpReminderiOS:
    type: application
    platform: iOS
    sources:
      - Sources/StandUpReminderiOS
      - Sources/StandUpReminderCore
    info:
      path: Resources/iOS-Info.plist
      properties:
        CFBundleDisplayName: Stand Up
        CFBundleShortVersionString: "4.2.4"
        CFBundleVersion: "10"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Optional: your approximate location fetches local weather for outdoor-walk suggestions."
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.thomasjust.standupreminder.refresh]
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "Stand Up reads recent workouts so a swim or gym session counts as your movement break."
        NSHealthUpdateUsageDescription: "Stand Up writes mindful-session minutes when you mark a movement break Done."
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.thomasjust.standupreminder
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_ENTITLEMENTS: Resources/StandUpReminderiOS.entitlements
    dependencies:
      - target: StandUpReminderWatch
      - target: StandUpReminderWidgetiOS
        embed: true

  StandUpReminderWidgetiOS:
    type: app-extension
    platform: iOS
    sources:
      - Sources/StandUpReminderWidget/StandUpReminderWidget.swift
      - Sources/StandUpReminderCore/BreakActivity.swift
      - Sources/StandUpReminderCore/AppIdentity.swift
      - Sources/StandUpReminderCore/AeroPalette.swift
    info:
      path: Resources/iOSWidget-Info.plist
      properties:
        CFBundleDisplayName: Stand Up
        CFBundleShortVersionString: "4.2.4"
        CFBundleVersion: "10"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thomasjust.standupreminder.widget
      SKIP_INSTALL: true
      CODE_SIGN_ENTITLEMENTS: Resources/StandUpReminderWidgetiOS.entitlements

  StandUpReminderWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/StandUpReminderWatch
      - Sources/StandUpReminderCore/AeroPalette.swift
    info:
      path: Resources/Watch-Info.plist
      properties:
        CFBundleDisplayName: Stand Up
        CFBundleShortVersionString: "4.2.4"
        CFBundleVersion: "10"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.thomasjust.standupreminder
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.thomasjust.standupreminder.watchkitapp
      CODE_SIGN_ENTITLEMENTS: Resources/StandUpReminderWatch.entitlements
    dependencies:
      - target: StandUpReminderWatchWidget
        embed: true

  StandUpReminderWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Sources/StandUpReminderWidget/StandUpReminderWidget.swift
      - Sources/StandUpReminderCore/AppIdentity.swift
      - Sources/StandUpReminderCore/AeroPalette.swift
    info:
      path: Resources/WatchWidget-Info.plist
      properties:
        CFBundleDisplayName: Stand Up
        CFBundleShortVersionString: "4.2.4"
        CFBundleVersion: "10"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.thomasjust.standupreminder.watchkitapp.widget
      SKIP_INSTALL: true
      CODE_SIGN_ENTITLEMENTS: Resources/StandUpReminderWatchWidget.entitlements
