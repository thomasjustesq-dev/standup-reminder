# Optional XcodeGen project for embedding the Notification Center widget.
#   brew install xcodegen
#   xcodegen generate
#   xcodebuild -scheme StandUpReminder -configuration Release
name: StandUpReminder
options:
  bundleIdPrefix: com.user
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  StandUpReminder:
    type: application
    platform: macOS
    sources:
      - Sources/StandUpReminder
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.user.StandUpReminder
      INFOPLIST_FILE: Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: Resources/StandUpReminder.entitlements
      LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks"]
    dependencies:
      - target: StandUpReminderWidget
        embed: true
  StandUpReminderWidget:
    type: app-extension
    platform: macOS
    sources:
      - Sources/StandUpReminderWidget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.user.StandUpReminder.widget
      INFOPLIST_FILE: Sources/StandUpReminderWidget/Info.plist
      SKIP_INSTALL: true
