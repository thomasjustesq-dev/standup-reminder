name: process-guard

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Write surface (agent branches)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          chmod +x scripts/check-write-surface.sh
          scripts/check-write-surface.sh "$BASE_SHA" "$HEAD_REF"
      - name: Coordination guard
        run: |
          chmod +x scripts/coordination-guard.sh
          scripts/coordination-guard.sh
      - name: Stale claims (advisory)
        run: |
          set +e
          chmod +x scripts/stale-claims.sh
          scripts/stale-claims.sh
          # Advisory must not paint a red X in the checks UI (PENUMBRA §9).
          # continue-on-error still renders red; exit 0 with warnings instead.
          exit 0
