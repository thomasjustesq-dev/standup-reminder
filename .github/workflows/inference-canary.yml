# Standing check that fleet inference credentials can perform inference.
#
# Preference order (Thomas 2026-08-19):
#   grok → openai (Codex) → kimi → gemini
#   GitHub-hosted Copilot is last-resort and is not probed here.
#   Anthropic console key is not a Copilot BYOK rung.
#
# Probes every present repository secret in that order via
# scripts/fleet-inference-canary.sh. Missing secrets are SKIP. Present-but-
# broken secrets fail the rung so dead keys surface. Preferred provider =
# first healthy entry.

name: inference-canary

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: inference-canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Probe fleet inference secrets (preference order)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_INFERENCE_MODEL: ${{ vars.XAI_INFERENCE_MODEL || 'grok-4.6' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_INFERENCE_MODEL: ${{ vars.OPENAI_INFERENCE_MODEL || 'gpt-5.6-sol' }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_INFERENCE_MODEL: ${{ vars.KIMI_INFERENCE_MODEL || 'kimi-k2.7-code' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_INFERENCE_MODEL: ${{ vars.GEMINI_INFERENCE_MODEL || 'gemini-3.7-flash' }}
        run: bash scripts/fleet-inference-canary.sh
