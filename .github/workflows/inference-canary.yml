# Standing check that fleet inference credentials can perform inference.
#
# Preference order (Thomas 2026-08-11):
#   grok → gemini → kimi → openai → anthropic
#
# Probes every present repository secret in that order via
# scripts/fleet-inference-canary.sh. Missing secrets are SKIP. Present-but-
# broken secrets fail the run so dead keys surface before a PR is blocked.
# Preferred provider = first healthy entry.
#
# Anthropic-specific history (2026-08-04 credit exhaustion) remains relevant:
# list-models-only health checks are not enough; each probe performs real
# inference. Claude Code Review still uses Anthropic only — this canary is the
# multi-provider health signal.

name: inference-canary

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: inference-canary
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Probe fleet inference secrets (preference order)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_INFERENCE_MODEL: ${{ vars.XAI_INFERENCE_MODEL || 'grok-3' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_INFERENCE_MODEL: ${{ vars.GEMINI_INFERENCE_MODEL || 'gemini-2.0-flash' }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_INFERENCE_MODEL: ${{ vars.KIMI_INFERENCE_MODEL || 'moonshot-v1-8k' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_INFERENCE_MODEL: ${{ vars.OPENAI_INFERENCE_MODEL || 'gpt-4o-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || '' }}
        run: bash scripts/fleet-inference-canary.sh
