name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: ./scripts/check-versions.sh
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  # Both schemes build in one job: macOS runners bill at 10x, and splitting
  # them meant paying for a second checkout, brew install, and xcodegen run to
  # produce the identical project. The builds serialize as a result, so this
  # trades a little PR wall-clock for roughly a third fewer billed minutes.
  xcode-builds:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Verify xcodegen output is fully gitignored
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::xcodegen generate dirtied the tree. Every generated file must be gitignored."
            git status --porcelain
            exit 1
          fi
      - name: Build macOS app (embeds widget)
        run: >
          xcodebuild -project StandUpReminder.xcodeproj
          -scheme StandUpReminder
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS app (embeds Watch app + both widget extensions)
        run: >
          xcodebuild -project StandUpReminder.xcodeproj
          -scheme StandUpReminderiOS
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
