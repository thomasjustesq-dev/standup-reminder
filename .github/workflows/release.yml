name: Release

# Tag-triggered release pipeline:
#   git tag v4.2.1 && git push origin v4.2.1
# builds the app (Developer ID + provisioning via App Store Connect API key),
# notarizes and staples it, packs a .zip (Sparkle) and .dmg, signs and commits
# an updated Sparkle appcast, and attaches everything to a GitHub release.
#
# Required repository secrets:
#   APPLE_CERTIFICATES_P12        base64 .p12 with the Developer ID Application cert + key
#   APPLE_CERTIFICATES_PASSWORD   password for that .p12
#   APP_STORE_CONNECT_KEY_ID      App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID   App Store Connect API issuer ID
#   APP_STORE_CONNECT_PRIVATE_KEY base64 .p8 contents of the API key
# Optional:
#   SPARKLE_ED_PRIVATE_KEY        Sparkle EdDSA private key; when set, docs/appcast.xml
#                                 is regenerated and committed back to main

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Job-level so the appcast step can condition on it (secrets are never
      # printed; this only gates whether the step runs).
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Resolve version from tag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          PLIST_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Resources/Info.plist)
          echo "build=$PLIST_BUILD" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" != "$PLIST_VERSION" ]]; then
            echo "::error::Tag v$VERSION does not match Info.plist CFBundleShortVersionString $PLIST_VERSION. Bump the version first."
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Set up signing keychain
        env:
          APPLE_CERTIFICATES_P12: ${{ secrets.APPLE_CERTIFICATES_P12 }}
          APPLE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATES_P12" | base64 --decode > signing.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import signing.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATES_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" build.keychain
          rm signing.p12

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > private_keys/AuthKey.p8

      - name: Install Developer ID provisioning profiles
        env:
          MAIN_PROFILE: ${{ secrets.APPLE_MAIN_PROVISIONING_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$MAIN_PROFILE" | base64 --decode > "$PROFILE_DIR/main.provisionprofile"
          echo "$WIDGET_PROFILE" | base64 --decode > "$PROFILE_DIR/widget.provisionprofile"
          security cms -D -i "$PROFILE_DIR/main.provisionprofile" >/dev/null
          security cms -D -i "$PROFILE_DIR/widget.provisionprofile" >/dev/null

      - name: Generate project
        run: xcodegen generate

      - name: Build Release (Developer ID, profiles via ASC API key)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: >
          xcodebuild -project StandUpReminder.xcodeproj
          -scheme StandUpReminder -configuration Release
          -derivedDataPath .derivedData
          -allowProvisioningUpdates
          -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          build

      - name: Stage app
        run: |
          mkdir -p dist
          cp -R ".derivedData/Build/Products/Release/StandUpReminder.app" dist/
          codesign --verify --deep --strict --verbose dist/StandUpReminder.app

      - name: Verify signed capabilities and embedded widget
        run: |
          APP="dist/StandUpReminder.app"
          ENTITLEMENTS="dist/signed-entitlements.plist"
          WIDGET="$APP/Contents/PlugIns/StandUpReminderWidget.appex"
          WIDGET_ENTITLEMENTS="dist/signed-widget-entitlements.plist"
          codesign -d --entitlements :- "$APP" > "$ENTITLEMENTS"
          plutil -lint "$ENTITLEMENTS"
          codesign -dvv "$APP" 2>&1 | grep -F '(runtime)'
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$ENTITLEMENTS" 2>/dev/null \
            | grep -qx true; then
            echo "error: release signature contains get-task-allow" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-container-identifiers' "$ENTITLEMENTS" \
            | grep -F 'iCloud.com.thomasjust.standupreminder'
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$ENTITLEMENTS" \
            | grep -F 'group.com.thomasjust.standupreminder'
          test -d "$WIDGET"
          codesign -d --entitlements :- "$WIDGET" > "$WIDGET_ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$WIDGET_ENTITLEMENTS" \
            | grep -F 'group.com.thomasjust.standupreminder'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' Resources/StandUpReminderiOS.entitlements)" = "true"
          test -f "$APP/Contents/embedded.provisionprofile"
          test -f "$WIDGET/Contents/embedded.provisionprofile"

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent dist/StandUpReminder.app dist/notarize.zip
          NOTARY_RESULT="$(xcrun notarytool submit dist/notarize.zip \
            --key "$GITHUB_WORKSPACE/private_keys/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait \
            --output-format json)"
          echo "$NOTARY_RESULT"
          SUBMISSION_ID="$(jq -r '.id' <<< "$NOTARY_RESULT")"
          STATUS="$(jq -r '.status' <<< "$NOTARY_RESULT")"
          if [[ "$STATUS" != "Accepted" ]]; then
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$GITHUB_WORKSPACE/private_keys/AuthKey.p8" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID"
            exit 1
          fi
          xcrun stapler staple dist/StandUpReminder.app
          spctl --assess --type execute -vv dist/StandUpReminder.app

      - name: Pack zip and dmg
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ditto -c -k --keepParent dist/StandUpReminder.app "dist/StandUpReminder-$VERSION.zip"
          hdiutil create -volname "Stand Up Reminder" \
            -srcfolder dist/StandUpReminder.app -ov -format UDZO \
            "dist/StandUpReminder-$VERSION.dmg"
          rm dist/notarize.zip

      - name: Update Sparkle appcast
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
        if: ${{ env.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          curl -sL https://github.com/sparkle-project/Sparkle/releases/download/2.7.0/Sparkle-2.7.0.tar.xz -o sparkle.tar.xz
          tar xf sparkle.tar.xz
          # sign_update prints: sparkle:edSignature="SIG" length="N"
          SIGNATURE=$(./Sparkle-2.7.0/bin/sign_update "dist/StandUpReminder-$VERSION.zip" "$SPARKLE_ED_PRIVATE_KEY" \
            | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          test -n "$SIGNATURE"
          python3 scripts/update-appcast.py \
            --version "$VERSION" --build "$BUILD" \
            --zip "dist/StandUpReminder-$VERSION.zip" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/StandUpReminder-$VERSION.zip" \
            --signature "$SIGNATURE" \
            --appcast docs/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "chore: appcast for v$VERSION [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: >
          gh release create "v$VERSION"
          "dist/StandUpReminder-$VERSION.dmg"
          "dist/StandUpReminder-$VERSION.zip"
          --title "Stand Up Reminder v$VERSION"
          --generate-notes
